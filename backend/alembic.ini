[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# The URL is read from the environment by migrations/env.py (DATABASE_URL).
# This placeholder only keeps the CLI happy when no .env is present.
sqlalchemy.url = postgresql+psycopg://vibespace:vibespace@localhost:5432/vibespace

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S